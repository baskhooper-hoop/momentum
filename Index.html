<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum</title>
<style>
  :root { color-scheme: light;
    --accent:#4f7cff; --accent2:#7a5cff; --accent-dark:#2f4fbf; --accent-soft:#eef2ff;
    --bg:#f6f8ff; --card:#ffffff; --text:#1c2333; --muted:#6b7488; --line:#e7eaf3;
    --good:#22a06b; --shadow:0 8px 24px rgba(30,40,80,.08);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:740px; margin:0 auto; padding:18px 16px 120px; }
  .wrap.parallel-active { max-width:1200px; }
  /* Header */
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo {
    width:44px; height:44px; border-radius:14px; flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:var(--shadow); position:relative;
  }
  .logo::after{ content:""; position:absolute; inset:13px; border-radius:6px; background:#fff; opacity:.9;
    clip-path:polygon(42% 66%,20% 45%,28% 37%,42% 50%,72% 22%,80% 30%); }
  .brand h1 { font-size:20px; margin:0; letter-spacing:-.02em; }
  .brand .vibe { font-size:12.5px; color:var(--muted); margin-top:1px; }
  .gear { border:none; background:var(--card); color:var(--muted); width:40px; height:40px;
    border-radius:12px; font-size:18px; cursor:pointer; box-shadow:var(--shadow); }
  .gear:hover{ color:var(--accent-dark); }

  /* Capture */
  .capture { background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:9px 12px; margin-bottom:12px; }
  .cap-row { display:flex; gap:10px; align-items:center; }
  .mic {
    width:46px; height:46px; flex:0 0 auto; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:20px;
    box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%, transparent); transition:transform .12s;
    display:flex; align-items:center; justify-content:center;
  }
  .mic:active { transform:scale(.94); }
  .mic.live { animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);}
    70%{box-shadow:0 0 0 16px rgba(0,0,0,0);} 100%{box-shadow:0 0 0 0 rgba(0,0,0,0);} }
  .cap-input { flex:1 1 auto; border:none; outline:none; font-size:16px; background:transparent; color:var(--text); min-width:0; }
  .send { border:none; background:var(--accent-soft); color:var(--accent-dark); font-weight:600;
    border-radius:12px; padding:10px 14px; cursor:pointer; font-size:14px; }
  .send:hover{ background:color-mix(in srgb,var(--accent) 18%,#fff); }
  .cap-hint { font-size:11.5px; color:var(--muted); margin:6px 4px 0; }
  .cap-status { font-size:13.5px; margin:6px 4px 0; min-height:0; }
  .cap-status .ok { color:var(--good); }
  .cap-status .undo { color:var(--accent-dark); cursor:pointer; text-decoration:underline; margin-left:8px; }
  .thinking { color:var(--muted); }
  .wake-hint { font-size:12px; color:var(--accent-dark); margin:8px 4px 0; display:flex; align-items:center; gap:6px; font-weight:600; }
  .wake-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink 1.3s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }

  /* Now card */
  .section-label { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:14px 4px 8px; font-weight:600; }
  .now {
    background:linear-gradient(160deg, color-mix(in srgb,var(--accent) 10%,#fff), var(--card));
    border:1px solid color-mix(in srgb,var(--accent) 22%,#fff);
    border-radius:24px; padding:30px 26px; box-shadow:0 12px 34px rgba(30,40,80,.11); min-height:210px;
  }
  .now .lead { display:flex; align-items:flex-start; gap:14px; }
  .prio-dot { width:12px; height:12px; border-radius:50%; margin-top:8px; flex:0 0 auto; }
  .prio-high{ background:#e5484d; } .prio-med{ background:var(--accent); } .prio-low{ background:#9aa3b5; }
  .now h2 { font-size:29px; margin:0; letter-spacing:-.02em; line-height:1.2; }
  .now .meta { font-size:14.5px; color:var(--muted); margin-top:10px; display:flex; gap:14px; flex-wrap:wrap; }
  .now .prio-dot { margin-top:12px; }
  .now-actions .btn { padding:14px 18px; font-size:15px; }
  .steps { margin:14px 0 4px; padding:0; list-style:none; }
  .steps li { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:15px; border-top:1px solid var(--line); }
  .steps li:first-child{ border-top:none; }
  .steps input { width:18px; height:18px; accent-color:var(--accent); }
  .steps li.done span { text-decoration:line-through; color:var(--muted); }
  .now-actions { display:flex; gap:9px; margin-top:16px; flex-wrap:wrap; }
  .btn { border:none; border-radius:13px; padding:12px 16px; font-size:14.5px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent); flex:1 1 auto; }
  .btn-good { background:var(--good); color:#fff; flex:1 1 auto; }
  .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn:active{ transform:translateY(1px); }
  .empty { text-align:center; color:var(--muted); padding:26px 12px; }
  .empty .big { font-size:34px; margin-bottom:6px; }

  /* progress + streak */
  .stats { display:flex; gap:12px; margin-top:14px; }
  .stat { flex:1; background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; }
  .ring { width:46px; height:46px; flex:0 0 auto; }
  .stat .n { font-size:20px; font-weight:700; line-height:1; }
  .stat .l { font-size:12px; color:var(--muted); }

  /* next up + all */
  .task { background:var(--card); border-radius:15px; padding:12px 14px; box-shadow:var(--shadow); margin-bottom:9px; display:flex; align-items:center; gap:11px; }
  .task .tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; cursor:pointer; background:#fff; }
  .task .tick:hover{ border-color:var(--good); }
  .task .body { flex:1 1 auto; min-width:0; }
  .task .t { font-size:15px; }
  .task .m { font-size:12px; color:var(--muted); margin-top:2px; }
  .task .mini { display:flex; gap:6px; }
  .mini button { border:none; background:var(--accent-soft); color:var(--accent-dark); border-radius:9px; padding:6px 8px; font-size:12px; cursor:pointer; }
  .mini button.del { background:#fdeaea; color:#c0343a; }
  .group-toggle { width:100%; text-align:left; background:none; border:none; color:var(--accent-dark); font-weight:600; cursor:pointer; padding:8px 4px; font-size:14px; }
  .hidden { display:none !important; }

  /* Notes / Remember */
  .notes-card { background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow); }
  .note-add { display:flex; gap:8px; }
  .note-add input { flex:1 1 auto; min-width:0; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:14.5px; outline:none; }
  .note-add input:focus { border-color:var(--accent); }
  .note-add button { border:none; background:var(--accent-soft); color:var(--accent-dark); font-weight:600; border-radius:10px; padding:0 15px; cursor:pointer; flex:0 0 auto; }
  .note-list { margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; }
  .note { display:flex; align-items:flex-start; gap:10px; background:color-mix(in srgb,var(--accent) 7%,#fff); border:1px solid var(--line); border-radius:11px; padding:9px 11px; font-size:14.5px; }
  .note span { flex:1 1 auto; word-break:break-word; }
  .note-x { border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; padding:0 2px; flex:0 0 auto; line-height:1.4; }
  .note-x:hover { color:#c0343a; }
  .note-empty { color:var(--muted); font-size:13.5px; margin-top:8px; }

  /* List switcher */
  .list-bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .list-pill { border:1px solid var(--line); background:var(--card); color:var(--muted); font-weight:600; font-size:14px; padding:8px 17px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow); transition:transform .1s; }
  .list-pill:active { transform:scale(.96); }
  .list-pill.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; }
  .mini button.move { background:color-mix(in srgb,var(--accent) 12%,#fff); color:var(--accent-dark); }
  .bulk-move { border:none; background:transparent; color:var(--muted); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:2px 0; }
  .bulk-move:hover { color:var(--accent-dark); }

  /* Gentle reminder banner */
  .reminder { position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-160%); background:var(--card); color:var(--text);
    border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:14px; box-shadow:0 14px 38px rgba(20,26,45,.18);
    padding:12px 14px; display:flex; align-items:center; gap:12px; z-index:65; width:420px; max-width:calc(100% - 32px);
    transition:transform .3s cubic-bezier(.2,.8,.2,1); }
  .reminder.show { transform:translateX(-50%) translateY(0); }
  .reminder .rtext { flex:1 1 auto; min-width:0; }
  .reminder .rmsg { font-size:14.5px; line-height:1.45; }
  .reminder .rwhy { font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.4; font-style:italic; }
  .reminder .ract { border:none; background:var(--accent); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; flex:0 0 auto; }
  .reminder .rx { border:none; background:transparent; color:var(--muted); font-size:16px; cursor:pointer; flex:0 0 auto; line-height:1; }
  .iv { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:9px; padding:6px 10px; font-size:13px; cursor:pointer; margin-left:6px; }
  .iv.on { background:var(--accent); color:#fff; border-color:transparent; }

  /* Morning debrief */
  .debrief-card { background:var(--card); border-radius:24px; padding:22px; width:430px; max-width:100%; max-height:82vh; overflow:auto; box-shadow:0 22px 64px rgba(0,0,0,.32); }
  .db-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .db-head h3 { margin:0; font-size:21px; letter-spacing:-.02em; }
  .db-sub { font-size:13px; color:var(--muted); margin-top:2px; }
  .db-line { font-size:15px; line-height:1.5; margin:10px 0 2px; }
  .db-empty { text-align:center; color:var(--muted); padding:22px 8px; font-size:15px; }
  .db-sec { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; margin:18px 0 8px; }
  .db-task { display:flex; align-items:center; gap:11px; background:color-mix(in srgb,var(--accent) 7%,#fff); border:1px solid var(--line); border-radius:13px; padding:10px 12px; margin-bottom:7px; }
  .db-num { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .db-body { flex:1 1 auto; min-width:0; }
  .db-t { font-size:15px; }
  .db-m { font-size:12px; color:var(--muted); margin-top:2px; }
  .db-start { border:none; background:var(--accent); color:#fff; border-radius:10px; padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer; flex:0 0 auto; }
  .db-lists { display:flex; gap:7px; flex-wrap:wrap; }
  .db-pill { background:var(--accent-soft); color:var(--accent-dark); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; }
  .db-why { font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.45; font-style:italic; }

  /* Why this matters */
  .now-why { margin-top:12px; padding:11px 13px; background:color-mix(in srgb,var(--accent) 8%,#fff); border-left:3px solid var(--accent); border-radius:10px; font-size:14px; line-height:1.5; }
  .now-why b.wl { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-dark); font-weight:700; margin-bottom:3px; }
  .why-btn { margin-top:12px; border:1px dashed var(--line); background:transparent; color:var(--accent-dark); border-radius:10px; padding:9px 12px; font-size:13.5px; cursor:pointer; font-weight:600; }
  .why-btn:hover { background:var(--accent-soft); }

  /* Manual progress marks */
  .progress-row { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .progress-row .pr-label { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; }
  .pips { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin:11px 0 12px; }
  .pip { width:28px; height:28px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--accent),var(--accent2)); cursor:pointer; transition:transform .1s; box-shadow:0 2px 7px color-mix(in srgb,var(--accent) 35%,transparent); }
  .pip:active { transform:scale(.88); }
  .pips .none { color:var(--muted); font-size:13px; }
  .pr-add { border:2px dashed color-mix(in srgb,var(--accent) 45%,#fff); background:transparent; color:var(--accent-dark); border-radius:12px; padding:10px 15px; font-size:14px; font-weight:700; cursor:pointer; }
  .pr-add:hover { background:var(--accent-soft); }
  .task .prog { font-size:11px; color:var(--accent-dark); font-weight:700; margin-top:2px; }
  @media (prefers-reduced-motion: reduce){ .reminder{ transition:none; } .wake-dot{ animation:none; } }

  /* Talk with Momentum */
  .chat-card { background:var(--card); border-radius:24px; width:440px; max-width:100%; max-height:86vh; display:flex; flex-direction:column; box-shadow:0 22px 64px rgba(0,0,0,.32); overflow:hidden; }
  .chat-head { display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line); }
  .chat-head h3 { margin:0; font-size:17px; }
  .chat-msgs { flex:1 1 auto; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:9px; min-height:200px; }
  .bubble { max-width:82%; padding:10px 13px; border-radius:15px; font-size:14.5px; line-height:1.45; white-space:pre-wrap; }
  .bubble.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
  .bubble.mo { align-self:flex-start; background:color-mix(in srgb,var(--accent) 8%,#fff); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .chat-empty { color:var(--muted); font-size:14px; text-align:center; margin:auto; padding:20px; line-height:1.5; }
  .chat-input { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); align-items:center; }
  .chat-input input { flex:1 1 auto; min-width:0; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:15px; outline:none; }
  .chat-input input:focus { border-color:var(--accent); }
  .chat-mic { width:42px; height:42px; flex:0 0 auto; border-radius:50%; border:none; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:17px; cursor:pointer; }
  .chat-mic.live { animation:pulse 1.1s infinite; }
  .chat-send { border:none; background:var(--accent-soft); color:var(--accent-dark); font-weight:600; border-radius:12px; padding:0 15px; height:42px; cursor:pointer; }

  /* Timer overlay */
  .overlay { position:fixed; inset:0; background:rgba(20,26,45,.55); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:40; padding:20px; }
  .timer-card { background:var(--card); border-radius:26px; padding:26px; width:340px; max-width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .timer-card h3 { margin:0 0 4px; font-size:17px; }
  .timer-card .sub { font-size:13px; color:var(--muted); margin-bottom:16px; }
  .clock { position:relative; width:220px; height:220px; margin:0 auto; }
  .clock .time { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .timer-actions { display:flex; gap:9px; margin-top:20px; }
  .settings-card { background:var(--card); border-radius:22px; padding:22px; width:340px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); max-height:86vh; overflow:auto; }
  .settings-card h3{ margin:0 0 14px; }
  .opt { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--line); font-size:15px; }
  .opt:first-of-type{ border-top:none; }
  .switch { width:46px; height:27px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; transition:.15s; flex:0 0 auto; }
  .switch.on { background:var(--accent); }
  .switch i { position:absolute; top:3px; left:3px; width:21px; height:21px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .switch.on i { left:22px; }
  .settings-card .close { margin-top:16px; width:100%; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:60; }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--text); color:#fff;
    padding:12px 18px; border-radius:14px; font-size:14.5px; z-index:70; box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; transition:opacity .2s, transform .2s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }
  @media (prefers-reduced-motion: reduce){ .mic.live{animation:none;} .btn:active{transform:none;} .chat-mic.live{animation:none;} }

  /* Parallel mode */
  .parallel-toggle { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; box-shadow:var(--shadow); transition:.1s; }
  .parallel-toggle:hover { color:var(--accent-dark); border-color:var(--accent); }
  .parallel-toggle.on { background:var(--accent); color:#fff; border-color:transparent; }
  .parallel-row { display:flex; gap:16px; align-items:stretch; width:100%; }
  .parallel-left-slots { display:flex; gap:16px; flex:1 1 0; min-width:0; }
  .parallel-slot-wrap { flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
  .parallel-slot-wrap .now { flex:1 1 auto; min-width:0; max-width:none; }
  .parallel-anchor-col { flex:2 1 0; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .parallel-anchor-col .capture { margin-bottom:0; }
  .parallel-anchor-col .now { flex:1 1 auto; }
  .parallel-slot { flex:1 1 auto; background:var(--card); border:2px dashed var(--line); border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px 16px; cursor:pointer; color:var(--muted); font-size:14px; transition:.12s; }
  .parallel-slot:hover { border-color:var(--accent); color:var(--accent-dark); background:var(--accent-soft); }
  .parallel-slot .slot-icon { font-size:26px; }
  .parallel-slot .slot-hint { font-size:12px; text-align:center; line-height:1.4; }
  .par-close { position:absolute; top:10px; right:10px; border:none; background:rgba(0,0,0,.08); color:var(--muted); width:24px; height:24px; border-radius:50%; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .par-close:hover { background:rgba(0,0,0,.16); color:var(--text); }
  .now { position:relative; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Momentum</h1>
        <div class="vibe" id="vibe">today's vibe</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end">
      <button class="parallel-toggle" id="parallelBtn" title="Show up to 3 active tasks side by side">&#9646;&#9646;&#9646; Parallel</button>
      <button class="gear" id="chatBtn" title="Talk with Momentum">&#128172;</button>
      <button class="gear" id="debriefBtn" title="Morning debrief">&#9728;</button>
      <button class="gear" id="gearBtn" title="Settings">&#9881;</button>
    </div>
  </header>

  <div class="list-bar" id="listBar"></div>

  <div class="capture">
    <div class="cap-row">
      <button class="mic" id="micBtn" title="Tap and talk (or press Space)">&#127908;</button>
      <input class="cap-input" id="capInput" placeholder="Tap the mic and talk, or type a brain-dump…" autocomplete="off">
      <button class="send" id="sendBtn">Add</button>
    </div>
    <div class="cap-hint">Try: “Call the dentist tomorrow, finish the slides by Friday, and buy cat food.”</div>
    <div class="cap-status" id="capStatus"></div>
    <div class="wake-hint" id="wakeHint"></div>
  </div>

  <div id="app"></div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  /* ---------- State ---------- */
  var KEY = "momentum_state_v1";
  var state = load();
  var parallelMode = false;
  var parallelSlots = [null, null]; // ids of tasks pinned to left two slots
  function load(){
    try { var s = JSON.parse(localStorage.getItem(KEY)); if(s && s.tasks){
      s.notes=s.notes||[]; s.settings=s.settings||{}; if(s.settings.apiKey===undefined) s.settings.apiKey=''; if(s.settings.autoFile===undefined) s.settings.autoFile=false;
      if(s.settings.remindDue===undefined) s.settings.remindDue=true; if(s.settings.focusNudge===undefined) s.settings.focusNudge=true; if(s.settings.focusNudgeMin===undefined) s.settings.focusNudgeMin=20;
      if(s.lastDebrief===undefined) s.lastDebrief=''; if(s.settings.voiceName===undefined) s.settings.voiceName='';
      if(s.settings.wake===undefined) s.settings.wake=false;
      if(!s.autoFileReset){ s.settings.autoFile=false; s.autoFileReset=true; }
      s.lists = s.lists || [{id:'personal',name:'Personal'},{id:'work',name:'Work'}];
      if(!s.activeList) s.activeList=s.lists[0].id;
      s.tasks.forEach(function(t){ if(!t.list) t.list=s.activeList; });
      return s; } } catch(e){}
    return { tasks:[], notes:[], completions:[],
      lists:[{id:'personal',name:'Personal'},{id:'work',name:'Work'}], activeList:'personal', lastDebrief:'', autoFileReset:true,
      settings:{ sound:true, voice:true, calm:false, autoFile:false, remindDue:true, focusNudge:true, focusNudgeMin:20, voiceName:'', wake:false, apiKey:'' } };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ---------- Back up / restore ---------- */
  function exportBackup(){
    try{
      var blob=new Blob([JSON.stringify(state)],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download='momentum-backup-'+todayKey()+'.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },1500);
      toast('Backup downloaded.');
    }catch(e){ alert('Couldn’t create the backup file.'); }
  }
  function importBackup(file, ov){
    var r=new FileReader();
    r.onload=function(){
      try{
        var s=JSON.parse(r.result);
        if(!s || !Array.isArray(s.tasks)) throw new Error('bad');
        if(!confirm('Restore '+s.tasks.length+' task(s) from this backup? This replaces your current list.')) return;
        s.notes=s.notes||[]; s.completions=s.completions||[]; s.settings=s.settings||state.settings;
        s.lists=(s.lists&&s.lists.length)?s.lists:state.lists; if(!s.activeList) s.activeList=s.lists[0].id;
        if(s.lastDebrief===undefined) s.lastDebrief=''; if(s.autoFileReset===undefined) s.autoFileReset=true;
        s.tasks.forEach(function(t){ if(!t.list) t.list=s.activeList; if(t.progress===undefined) t.progress=0; });
        state=s; save(); render(); if(ov) ov.remove(); toast('Restored '+s.tasks.length+' task'+(s.tasks.length===1?'':'s')+'.');
      }catch(e){ alert('Hmm, that file didn’t look like a Momentum backup.'); }
    };
    r.readAsText(file);
  }

  /* ---------- Daily theme ---------- */
  function dayOfYear(d){ var s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
  function applyTheme(){
    var root=document.documentElement;
    if(state.settings.calm){
      root.style.setProperty('--accent','#5b6b8c'); root.style.setProperty('--accent2','#7d8bab');
      root.style.setProperty('--accent-dark','#3d4a63'); root.style.setProperty('--accent-soft','#eef1f6');
      root.style.setProperty('--bg','#f4f6fa'); document.getElementById('vibe').textContent='Calm mode · low stimulation';
      return;
    }
    var doy=dayOfYear(new Date());
    var hue=(doy*47)%360; var hue2=(hue+34)%360;
    var accent='hsl('+hue+',68%,52%)';
    var accent2='hsl('+hue2+',66%,58%)';
    var accentDark='hsl('+hue+',60%,34%)';
    var accentSoft='hsl('+hue+',70%,96%)';
    var bg='hsl('+hue+',48%,97%)';
    root.style.setProperty('--accent',accent);
    root.style.setProperty('--accent2',accent2);
    root.style.setProperty('--accent-dark',accentDark);
    root.style.setProperty('--accent-soft',accentSoft);
    root.style.setProperty('--bg',bg);
    document.getElementById('vibe').textContent="Today’s vibe · "+vibeName(hue, doy);
  }
  function vibeName(h, doy){
    var fam = h<16?'Rose':h<45?'Coral':h<70?'Amber':h<92?'Lime':h<150?'Green':h<180?'Teal':
      h<200?'Aqua':h<240?'Sky':h<270?'Indigo':h<300?'Violet':h<330?'Magenta':'Pink';
    var adj=['Calm','Bright','Fresh','Warm','Cool','Soft','Bold','Gentle','Deep','Sunny','Electric','Dreamy','Vivid','Quiet','Bloom'];
    return adj[doy%adj.length]+' '+fam;
  }

  /* ---------- Date helpers ---------- */
  function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
  function todayKey(){ return startOfDay(new Date()).toISOString().slice(0,10); }
  function fmtDue(iso){
    if(!iso) return null;
    var d=new Date(iso); if(isNaN(d)) return null;
    var t0=startOfDay(new Date()), td=startOfDay(d);
    var diff=Math.round((td-t0)/86400000);
    var day = diff===0?'Today':diff===1?'Tomorrow':diff===-1?'Yesterday':
      (diff>1&&diff<7)?d.toLocaleDateString(undefined,{weekday:'long'}):
      d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    var hasTime = new Date(iso).getHours()||new Date(iso).getMinutes();
    var tm = hasTime? ' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : '';
    return { label:day+tm, overdue: d < new Date() && diff<=0 };
  }

  /* ---------- Capture: voice + AI parse ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec=null, listening=false;
  var micBtn=document.getElementById('micBtn');
  var capInput=document.getElementById('capInput');
  var capStatus=document.getElementById('capStatus');

  function setStatus(html, cls){ capStatus.innerHTML = cls? '<span class="'+cls+'">'+html+'</span>' : html; }

  micBtn.addEventListener('click', function(){
    if(!SR || !state.settings.voice){
      setStatus(!SR? 'Voice isn’t available here — just type and press Add.' : 'Voice is off (turn it on in settings).','thinking');
      capInput.focus(); return;
    }
    if(listening){ try{rec.stop();}catch(e){} return; }
    startVoice();
  });
  function startVoice(){
    stopWake();
    try{
      rec = new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true;
      listening=true; micBtn.classList.add('live'); setStatus('Listening… take your time — I’ll add it a few seconds after you pause.','thinking');
      var finalText='', silenceT=null;
      var armSilence=function(){ clearTimeout(silenceT); silenceT=setTimeout(function(){ try{ rec.stop(); }catch(e){} }, 7000); };
      rec.onresult=function(e){
        var interim='';
        for(var i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal) finalText+=e.results[i][0].transcript+' ';
          else interim+=e.results[i][0].transcript;
        }
        capInput.value=(finalText+interim).trim();
        armSilence();
      };
      rec.onerror=function(ev){ clearTimeout(silenceT); listening=false; micBtn.classList.remove('live');
        setStatus(ev.error==='not-allowed'?'Mic permission blocked — you can type instead.':'Didn’t catch that — try again or type it.','thinking');
        if(state.settings.wake) setTimeout(ensureWake,900); };
      rec.onend=function(){ clearTimeout(silenceT); listening=false; micBtn.classList.remove('live');
        var v=capInput.value.trim(); if(v){ submitCapture(v); }
        if(state.settings.wake) setTimeout(ensureWake,900); };
      rec.start(); armSilence();
    }catch(e){ listening=false; micBtn.classList.remove('live'); setStatus('Voice failed to start — type instead.','thinking'); capInput.focus(); if(state.settings.wake) setTimeout(ensureWake,900); }
  }

  document.getElementById('sendBtn').addEventListener('click', function(){
    var v=capInput.value.trim(); if(v) submitCapture(v);
  });
  capInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var v=capInput.value.trim(); if(v) submitCapture(v); }});
  // Space anywhere (not while typing) = talk
  document.addEventListener('keydown', function(e){
    if(e.code==='Space' && document.activeElement!==capInput && !document.querySelector('.overlay')){
      e.preventDefault(); micBtn.click();
    }
  });

  var lastBatch=[]; // for undo
  async function submitCapture(text){
    var noteM = text.match(/^(?:note|remember this|jot(?: down)?)\s*[:\-]\s*(.+)/i);
    if(noteM){ addNote(noteM[1]); capInput.value=''; setStatus('Pinned to Remember.','ok'); return; }
    var sw = detectListSwitch(text);
    if(sw){ capInput.value='';
      if(sw!==state.activeList){ setActiveList(sw); setStatus('Switched to '+listName(sw)+'.','ok'); speak('Okay — '+listName(sw)+'.'); }
      else { setStatus('Already on '+listName(sw)+'.','ok'); }
      return; }
    capInput.value=''; setStatus('Thinking…','thinking');
    var result = await parseTasks(text);
    // AI-detected fuzzy switch intent (e.g. "let me deal with home stuff")
    if(result.switchTo && state.lists.some(function(l){return l.id===result.switchTo;}) && (!result.tasks || !result.tasks.length)){
      if(result.switchTo!==state.activeList) setActiveList(result.switchTo);
      setStatus(result.reply||('Switched to '+listName(result.switchTo)+'.'),'ok');
      speak(result.reply||('Okay — '+listName(result.switchTo)+'.'));
      return;
    }
    var added=[], byList={};
    (result.tasks||[]).forEach(function(t){
      var lst=state.activeList;
      if(state.settings.autoFile!==false && t.list && state.lists.some(function(l){return l.id===t.list;})) lst=t.list;
      var task={ id:uid(), title:(t.title||'').trim()||text.slice(0,60),
        dueAt:t.dueAt||null, timeEstimateMin:t.timeEstimateMin||null,
        priority:['low','med','high'].indexOf(t.priority)>=0?t.priority:'med',
        microSteps:Array.isArray(t.microSteps)?t.microSteps.slice(0,5):[],
        why:(t.why||'').trim(),
        microDone:[], progress:0, list:lst, done:false, later:false, createdAt:Date.now() };
      if(!task.why) task.why=fallbackWhy(task);
      state.tasks.push(task); added.push(task.id); byList[lst]=(byList[lst]||0)+1;
    });
    lastBatch=added; save(); render();
    var n=added.length;
    var where='';
    if(Object.keys(byList).some(function(k){return k!==state.activeList;})){
      where=' · '+Object.keys(byList).map(function(k){return byList[k]+' → '+listName(k);}).join(', ');
    }
    setStatus((result.reply||('Added '+n+' task'+(n===1?'':'s')+'.'))+where
      +' <span class="undo" id="undoBtn">undo</span>','ok');
    var ub=document.getElementById('undoBtn'); if(ub) ub.addEventListener('click',undoLast);
    speak(result.reply||('Added '+n+(n===1?' task':' tasks')));
  }
  function undoLast(){
    state.tasks=state.tasks.filter(function(t){ return lastBatch.indexOf(t.id)<0; });
    lastBatch=[]; save(); render(); setStatus('Undone.','thinking');
  }

  /* ---------- Wake word: "Hey Momentum" ---------- */
  var wakeRec=null;
  function wakeShouldRun(){ return SR && state.settings.wake && !listening && !chatListening && !document.getElementById('chatOverlay'); }
  function setWakeIndicator(on){ var wh=document.getElementById('wakeHint'); if(!wh) return; wh.innerHTML = on ? '<span class="wake-dot"></span> Listening for “Hey Momentum”…' : ''; }
  function ensureWake(){ if(wakeShouldRun() && !wakeRec) startWake(); }
  function startWake(){
    try{
      wakeRec=new SR(); wakeRec.lang='en-US'; wakeRec.interimResults=true; wakeRec.continuous=true;
      wakeRec.onresult=function(e){
        var txt=''; for(var i=0;i<e.results.length;i++){ txt+=e.results[i][0].transcript+' '; }
        if(/\bhey\s+moment|\bhey\s+mo\b|\bmomentum\b|\bhey\s+memento|\bhey\s+momento|\bhey\s+moe?ment/i.test(txt)) triggerWake();
      };
      wakeRec.onerror=function(){};
      wakeRec.onend=function(){ wakeRec=null; setTimeout(ensureWake, 700); };
      wakeRec.start(); setWakeIndicator(true);
    }catch(e){ wakeRec=null; }
  }
  function stopWake(){ setWakeIndicator(false); if(wakeRec){ try{ var r=wakeRec; wakeRec=null; r.onend=null; r.onresult=null; r.stop(); }catch(e){} } }
  function triggerWake(){
    stopWake(); softPing(); setStatus('Yes? Listening… go ahead.','thinking');
    setTimeout(function(){ if(!listening) startVoice(); }, 450);
  }

  // AI parse: cowork.askClaude (in Cowork) or Anthropic API (standalone w/ key); graceful on-device fallback
  function buildPrompt(text){
    var today=new Date();
    var listInfo=state.lists.map(function(l){return '"'+l.id+'" ('+l.name+')';}).join(', ');
    return 'You are the parsing brain for an ADHD task manager that has multiple task lists.\n'
      +'Available lists: '+listInfo+'. The user is currently viewing list "'+state.activeList+'".\n'
      +'Today is '+today.toDateString()+' (ISO '+today.toISOString()+', local hour '+today.getHours()+').\n'
      +'User said: """'+text+'"""\n\n'
      +'STEP 1 — intent: If the message is ONLY a request to switch/change which list is being viewed and contains NO task to add (e.g. "let me deal with home stuff", "time to focus on the job"), set "switchTo" to the target list id and return "tasks":[]. Otherwise set "switchTo":null.\n'
      +'STEP 2 — if adding, for each task:\n- title: short imperative.\n'
      +'- list: the best-fitting list id, judged by content (work = job/office/clients/meetings/professional; personal = home/health/errands/family/self). If genuinely unclear, use "'+state.activeList+'".\n'
      +'- dueAt: ISO-8601 datetime or null; resolve tomorrow/tonight/Friday/"in 2 hours" relative to today.\n'
      +'- timeEstimateMin: integer minutes or null.\n- priority: "low","med", or "high".\n'
      +'- If big/vague/multi-part, add 2-5 short concrete microSteps; else microSteps:[].\n'
      +'- why: 1-2 warm, specific sentences on why this task matters — the real benefit of doing it or the cost of skipping it — so an ADHD brain can feel its importance. Concrete and encouraging, not preachy.\n'
      +'reply: one short warm encouraging sentence (max 14 words, no emojis).\n'
      +'Return ONLY minified JSON, no markdown: {"switchTo":null,"tasks":[{"title":"","list":"'+state.activeList+'","why":"","dueAt":null,"timeEstimateMin":null,"priority":"med","microSteps":[]}],"reply":""}';
  }
  async function parseTasks(text){
    var prompt=buildPrompt(text);
    try{
      if(window.cowork && typeof window.cowork.askClaude==='function'){
        var raw= await window.cowork.askClaude(prompt,[text]);
        var str = typeof raw==='string'? raw : (raw && raw.content && raw.content[0] && raw.content[0].text) || (raw&&raw.text) || JSON.stringify(raw);
        var json = extractJSON(str);
        if(json && json.tasks) return json;
      } else if(state.settings.apiKey){
        setStatus('Thinking…','thinking');
        var out = await callAnthropic(prompt, state.settings.apiKey);
        var j2 = extractJSON(out);
        if(j2 && j2.tasks) return j2;
      }
    }catch(e){ /* fall through to on-device */ }
    return localParse(text);
  }
  async function callAnthropic(prompt, key){
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key':key,
        'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:1024,
        messages:[{ role:'user', content:prompt }] })
    });
    if(!res.ok){ throw new Error('API '+res.status); }
    var data = await res.json();
    return (data.content && data.content[0] && data.content[0].text) || '';
  }
  // Reasoned "why this matters" — offline fallback
  function fallbackWhy(t){
    var bits=[];
    if(t.dueAt){ var due=fmtDue(t.dueAt); if(due){ if(due.overdue) bits.push('It’s already past due, so finishing it now stops it hanging over you and frees up the mental space it’s been quietly taking.'); else bits.push('It has a deadline ('+due.label+'), so doing it a little early means no last-minute scramble and a lot less stress.'); } }
    if(t.priority==='high') bits.push('You flagged this as high priority — clearing it lifts the biggest weight off your mind right now.');
    if(!bits.length) bits.push('Getting this done is a small, real win. It builds momentum and shows your brain that things actually move once you start.');
    return bits.join(' ');
  }
  async function generateWhy(id){
    var t=find(id); if(!t) return;
    var btn=app.querySelector('[data-why="'+id+'"]'); if(btn){ btn.textContent='Thinking…'; btn.disabled=true; }
    var why='';
    try{
      var prompt='In 1-2 warm, motivating sentences, explain why this task matters and why it is worth doing — to help someone with ADHD who struggles to feel importance. Be specific and encouraging, not preachy. Task: "'+t.title+'"'+(t.dueAt&&fmtDue(t.dueAt)?' (due '+fmtDue(t.dueAt).label+')':'')+'. Reply with only the sentences.';
      if(window.cowork && typeof window.cowork.askClaude==='function'){ var raw=await window.cowork.askClaude(prompt,[t.title]); why=(typeof raw==='string'?raw:(raw&&raw.content&&raw.content[0]&&raw.content[0].text)||'').trim(); }
      else if(state.settings.apiKey){ why=(await callAnthropic(prompt, state.settings.apiKey)).trim(); }
    }catch(e){}
    if(!why) why=fallbackWhy(t);
    t.why=why.replace(/^["“”]+|["“”]+$/g,''); save(); render();
  }
  function extractJSON(s){
    if(!s) return null;
    s=String(s).replace(/```json/gi,'').replace(/```/g,'').trim();
    var a=s.indexOf('{'), b=s.lastIndexOf('}');
    if(a>=0&&b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
    return null;
  }
  // Offline keyword classifier for auto-filing
  function guessList(text){
    if(!state.settings || state.settings.autoFile===false) return state.activeList;
    var t=' '+String(text).toLowerCase()+' ';
    var work=/\b(work|job|office|boss|client|meeting|meet|email|report|deck|slide|slides|presentation|invoice|deploy|standup|sprint|jira|ticket|slack|project|colleague|coworker|team|interview|deadline|contract|proposal|demo)\b/;
    var pers=/\b(gym|workout|run|doctor|dentist|appointment|grocery|groceries|rent|mortgage|mom|dad|mum|family|kid|kids|laundry|dishes|clean|vet|dog|cat|birthday|home|health|meds|medication|prescription|bank|car|haircut|dinner|date|friend)\b/;
    var hasWork=state.lists.some(function(l){return l.id==='work';});
    var hasPers=state.lists.some(function(l){return l.id==='personal';});
    if(hasWork && work.test(t) && !pers.test(t)) return 'work';
    if(hasPers && pers.test(t) && !work.test(t)) return 'personal';
    return state.activeList;
  }
  // On-device fallback parser (no network)
  function localParse(text){
    var chunks=text.split(/\n|,| and | then |;| also /i).map(function(c){return c.trim();}).filter(Boolean);
    if(!chunks.length) chunks=[text];
    var tasks=chunks.map(function(c){
      var title=c.replace(/^(remind me to|i need to|i have to|i've got to|i gotta|need to|gotta|please|remember to)\s+/i,'');
      title=title.charAt(0).toUpperCase()+title.slice(1);
      var due=null, low=c.toLowerCase();
      var day0=startOfDay(new Date());
      if(/\btonight\b|\btoday\b/.test(low)){ var d=new Date(); d.setHours(20,0,0,0); due=d.toISOString(); }
      else if(/\btomorrow\b/.test(low)){ var d2=new Date(day0); d2.setDate(d2.getDate()+1); d2.setHours(9,0,0,0); due=d2.toISOString(); }
      else {
        var days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
        for(var i=0;i<7;i++){ if(low.indexOf(days[i])>=0){ var t=new Date(day0); var add=(i-t.getDay()+7)%7||7; t.setDate(t.getDate()+add); t.setHours(9,0,0,0); due=t.toISOString(); break; } }
      }
      var est=null, m=low.match(/(\d+)\s*(hour|hr|minute|min)/);
      if(m){ est=parseInt(m[1],10)*(/h/.test(m[2])?60:1); }
      var prio=/(urgent|asap|important|critical|!)/.test(low)?'high':'med';
      return { title:title, list:guessList(c), dueAt:due, timeEstimateMin:est, priority:prio, microSteps:[] };
    });
    return { tasks:tasks, reply:'Got it — added '+tasks.length+' task'+(tasks.length===1?'':'s')+'. Nice.' };
  }

  /* ---------- Voice out ---------- */
  var voices=[];
  function bestVoice(){
    var en=voices.filter(function(v){return /^en/i.test(v.lang);});
    var pref=['natural','google us english','samantha','aria','jenny','zira','serena','allison','ava','google','microsoft'];
    for(var i=0;i<pref.length;i++){ var m=en.filter(function(v){return v.name.toLowerCase().indexOf(pref[i])>=0;})[0]; if(m) return m; }
    return en[0]||voices[0]||null;
  }
  function loadVoices(){
    try{ voices=window.speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; }
    if(voices.length && !state.settings.voiceName){ var b=bestVoice(); if(b){ state.settings.voiceName=b.name; save(); } }
  }
  function speak(t){
    if(!state.settings.voice || !window.speechSynthesis || !t) return;
    try{ if(!voices.length) loadVoices();
      var u=new SpeechSynthesisUtterance(t); u.rate=1.0; u.pitch=1.02;
      var v=voices.filter(function(x){return x.name===state.settings.voiceName;})[0]||bestVoice();
      if(v) u.voice=v;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function speakThen(t, cb){
    if(!state.settings.voice || !window.speechSynthesis || !t){ if(cb) setTimeout(cb,300); return; }
    try{ if(!voices.length) loadVoices();
      var u=new SpeechSynthesisUtterance(t); u.rate=1.0; u.pitch=1.02;
      var v=voices.filter(function(x){return x.name===state.settings.voiceName;})[0]||bestVoice();
      if(v) u.voice=v;
      u.onend=function(){ if(cb) cb(); };
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }catch(e){ if(cb) cb(); }
  }

  /* ---------- Sorting / selection ---------- */
  function activeTasks(){
    var p={high:0,med:1,low:2};
    return state.tasks.filter(function(t){return !t.done && t.list===state.activeList;}).sort(function(a,b){
      if(a.later!==b.later) return a.later?1:-1;
      var da=a.dueAt?new Date(a.dueAt).getTime():Infinity, db=b.dueAt?new Date(b.dueAt).getTime():Infinity;
      var ao=da<Date.now(), bo=db<Date.now();
      if(ao!==bo) return ao?-1:1;
      if(p[a.priority]!==p[b.priority]) return p[a.priority]-p[b.priority];
      if(da!==db) return da-db;
      return a.createdAt-b.createdAt;
    });
  }

  // Deterministic switch-command detection (never hijacks a real task like "work on the deck")
  function detectListSwitch(text){
    var raw=text.toLowerCase().trim().replace(/[.!?]+$/,'');
    function has(id){ return state.lists.some(function(l){return l.id===id;}); }
    var map={};
    state.lists.forEach(function(l){ map[l.name.toLowerCase()]=l.id; map[l.id]=l.id; });
    if(has('work')){ map['work']='work'; map['job']='work'; map['office']='work'; }
    if(has('personal')){ map['personal']='personal'; }
    var verbRe=/\b(switch|change|flip|go|jump|open|show|take|bring|move|pull up)\b/;
    var bare=raw.replace(/^(please\s+)?(switch|change|flip|go|jump|open|show|take|bring|move|pull up)\s+(me\s+)?(to|over to|into|up)?\s*/,'')
                .replace(/\b(the|my)\b/g,'').replace(/\b(list|mode|tasks|view)\b/g,'').replace(/\s+/g,' ').trim();
    if(map[bare]) return map[bare];
    var m=raw.match(/\b([a-z]+)\s+(?:list|mode|tasks|view)\b/);
    if(m && map[m[1]]) return map[m[1]];
    if(verbRe.test(raw)){ for(var k in map){ if(new RegExp('\\b'+k+'\\b').test(raw)) return map[k]; } }
    return null;
  }

  function chime(){

    try{
      var ac=new (window.AudioContext||window.webkitAudioContext)();
      [0,0.12].forEach(function(dt,i){
        var o=ac.createOscillator(), g=ac.createGain();
        o.frequency.value=i?784:523.25; o.type='sine'; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001,ac.currentTime+dt); g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+dt+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dt+0.35);

  var cvs=document.getElementById('confetti'), ctx=cvs.getContext('2d');
  function confetti(){
    cvs.width=innerWidth; cvs.height=innerHeight;
    var col=getComputedStyle(document.documentElement).getPropertyValue('--accent')||'#4f7cff';
    var col2=getComputedStyle(document.documentElement).getPropertyValue('--accent2')||'#7a5cff';
    var cols=[col,col2,'#22a06b','#f5a623','#ffffff'];
    var P=[]; for(var i=0;i<90;i++) P.push({x:innerWidth/2,y:innerHeight*0.4,
      vx:(Math.random()-0.5)*14, vy:Math.random()*-14-4, g:0.4+Math.random()*0.2,
      s:5+Math.random()*6, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-0.5)*0.5, life:0});
    var t0=performance.now();
    (function frame(now){
      var e=now-t0; ctx.clearRect(0,0,cvs.width,cvs.height);
      P.forEach(function(p){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=0.99;

      if(e<1400) requestAnimationFrame(frame); else ctx.clearRect(0,0,cvs.width,cvs.height);
    })(t0);
  }

  var focusLines=['Still with you — right now: “T”. You’ve got this.','Gentle check-in — you’re on “T”.','Back to “T” whenever you’re ready. No rush.','One small step on “T” counts.','“T” is your one thing right now. You can do this.'];

      state.tasks.forEach(function(t){
        if(t.done || !t.dueAt) return;

        if(!t.remindedSoon && dt-now>0 && dt-now<=15*60000 && sameDay(dt,now)){

          showReminder('“'+t.title+'” is due in about 15 minutes.', 'Start', function(){ openTimer(t.id); }, t.why||fallbackWhy(t));
        }

  /* ---------- Morning debrief ---------- */
  function debriefData(){
    var active=state.tasks.filter(function(t){return !t.done;});
    var today=new Date(), sod=startOfDay(today).getTime(), p={high:0,med:1,low:2};
    var dueToday=active.filter(function(t){return t.dueAt && sameDay(t.dueAt,today);});
    var overdue=active.filter(function(t){return t.dueAt && new Date(t.dueAt).getTime()<sod;});
    function rank(t){ if(t.dueAt){ var dt=new Date(t.dueAt).getTime(); if(isNaN(dt)) return 3; if(dt<Date.now()) return 0; if(sameDay(dt,today)) return 1; return 2; } return 3; }
    var top=active.slice().sort(function(a,b){
      var ra=rank(a), rb=rank(b);
      if(ra!==rb) return ra-rb;
      if(ra<3){ var da=new Date(a.dueAt).getTime(), db=new Date(b.dueAt).getTime(); if(da!==db) return da-db; }
      if(p[a.priority]!==p[b.priority]) return p[a.priority]-p[b.priority];
      return a.createdAt-b.createdAt;
    }).slice(0,3);
    return { active:active, dueToday:dueToday, overdue:overdue, top:top };
  }

      var armSilence=function(){ clearTimeout(silenceT); silenceT=setTimeout(function(){ try{ chatRec.stop(); }catch(e){} }, 7000); };
      chatRec.onresult=function(e){ var interim=''; for(var i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) finalText+=e.results[i][0].transcript+' '; else interim+=e.results[i][0].transcript; } if(inp) inp.value=(finalText+interim).trim(); armSilence(); };
      chatRec.onerror=function(ev){ clearTimeout(silenceT); chatListening=false; chatHandsfree=false; var b2=document.getElementById('chMic'); if(b2) b2.classList.remove('live'); };
      chatRec.onend=function(){ clearTimeout(silenceT); chatListening=false; var b2=document.getElementById('chMic'); if(b2) b2.classList.remove('live'); var v=inp?inp.value.trim():''; if(v){ inp.value=''; sendChat(v); } };
      chatRec.start(); armSilence();
    }catch(e){ chatListening=false; chatHandsfree=false; }
  }

  /* ---------- Boot ---------- */
  applyTheme(); render();
  loadVoices(); try{ if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
  // Suppress retroactive due reminders for tasks already due/soon when the app opens (stay gentle)
  state.tasks.forEach(function(t){ if(t.dueAt){ var dt=new Date(t.dueAt).getTime();
    if(!isNaN(dt)){ if(dt<=Date.now()) t.remindedDue=true; if(dt-Date.now()<=15*60000) t.remindedSoon=true; } } });
  setInterval(checkReminders, 30000);
  document.getElementById('debriefBtn').onclick=openDebrief;
  document.getElementById('chatBtn').onclick=openChat;
  document.getElementById('parallelBtn').onclick=function(){
    parallelMode=!parallelMode;
    if(!parallelMode){ parallelSlots=[null,null]; }
    this.classList.toggle('on', parallelMode);
    document.querySelector('.wrap').classList.toggle('parallel-active', parallelMode);
    document.querySelector('.capture').style.display = parallelMode ? 'none' : '';
    this.title=parallelMode?'Back to single focus view':'Show up to 3 tasks side by side';
    render();
  };
  if(state.settings.wake) ensureWake();
  // Auto-run the debrief on the first open of each day, whatever time you sit down
  if(state.lastDebrief!==todayKey() && state.tasks.some(function(t){return !t.done;})) openDebrief();
  // re-theme if left open past midnight
  setInterval(applyTheme, 60*60*1000);
})();
</script>
</body>
</html>
